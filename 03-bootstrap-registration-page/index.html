<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="row">
 
            <div class="col-md-5">
                <h2 class="mb-3 text-center">Welcome! <br> Create an account</h2>
                
                <div class="mb-2">
                    <input type="text" class="form-control" placeholder="Username" id="uname">
                </div>
                <div class="mb-2">
                    <input type="password" class="form-control" placeholder="Password" id="psw">
                </div>
                <div class="mb-2">
                    <input type="email" class="form-control" placeholder="Email" id="email">
                </div>
                <div class="mb-2">
                    <input type="text" class="form-control" placeholder="Phone number" id="Phonenum">
                </div>
                
                <button type="submit">Login</button>
            </div>
    
            <div class="col-md-5 text-center">
                <img src="logo.png" alt="Image" class="img-fluid" width="600" height="600">
            </div>
        </div>
    </div>
    
</body>
</html>
