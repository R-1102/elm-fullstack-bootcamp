<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Grid & Flexbox Layout</title>
        <style>
            
            .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(150px, 1fr));
            grid-gap: 10px;
            }

            .gallery img {
            width: 100%;
            height: auto;
            object-fit: cover;
            }

            .flex-container {
                display: flex;
                justify-content: center; 
                align-items: center;
                gap: 10px; 
                background-color: #d3d3d3; 
                padding: 10px;
                border-radius: 10px;
            }

            .box {
                background-color: #4a90e2; 
                color: white; 
                padding: 20px 40px; 
                text-align: center;
                font-size: 20px; 
            }

        </style>   
    </head>
    <body>
        <h1>Responsive Image Gallery (CSS Grid)</h1>
        <div class="gallery">
            <img src="C:\Users\renad\Videos\ELM Training\pic.jpg"; alt="Gallery Image"  >
            <img src="C:\Users\renad\Videos\ELM Training\pic.jpg"; alt="Gallery Image"  >
            <img src="C:\Users\renad\Videos\ELM Training\pic.jpg"; alt="Gallery Image"  >
            <img src="C:\Users\renad\Videos\ELM Training\pic.jpg"; alt="Gallery Image" >
            <img src="C:\Users\renad\Videos\ELM Training\pic.jpg"; alt="Gallery Image" >
            <img src="C:\Users\renad\Videos\ELM Training\pic.jpg"; alt="Gallery Image" >
        </div>

        <h1>Responsive Flexbox Layout</h1>
        <div class="flex-container">
            <div class="box"> Box 1 </div>
            <div class="box">Box 2</div>
            <div class="box">Box 3</div>
        </div>
    </body>
</html>
